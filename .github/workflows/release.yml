name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for ARM cross-compilation)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin dazitui
          else
            cargo build --release --target ${{ matrix.target }} --bin dazitui
          fi

      - name: Package archive
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "release" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          ARCHIVE_NAME="dazitui-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/dazitui.exe" "dist/${ARCHIVE_NAME}/"
            [ -f README.md ] && cp README.md "dist/${ARCHIVE_NAME}/"
            [ -f LICENSE ] && cp LICENSE "dist/${ARCHIVE_NAME}/"
            cd dist
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            cp "target/${{ matrix.target }}/release/dazitui" "dist/${ARCHIVE_NAME}/"
            [ -f README.md ] && cp README.md "dist/${ARCHIVE_NAME}/"
            [ -f LICENSE ] && cp LICENSE "dist/${ARCHIVE_NAME}/"
            cd dist
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.*

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Collect and Generate Checksums
        shell: bash
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          echo "=== Artifacts ready for release ==="
          ls -la
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
