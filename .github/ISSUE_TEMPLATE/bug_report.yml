name: 🐛 缺陷报告 (Bug Report)
description: 报告 dazitui 运行中的异常、崩溃或不符合预期的行为
title: "[Bug] 简短描述问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，便于我们快速复现与定位问题。
        提交前可先搜索是否已有相同或相关 Issue。

  - type: textarea
    id: environment
    attributes:
      label: "环境信息"
      description: "运行 `dazitui --version` 的输出，以及系统/终端信息"
      placeholder: |
        dazitui 版本：v1.0.20
        操作系统：Arch Linux (x86_64)
        终端：Alacritty 0.13 / Kitty 0.35
        输入法：Fcitx5 + 虎码
        主题：Catppuccin Mocha
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: "问题描述"
      description: "简明描述出现了什么异常"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "复现步骤"
      description: "一步步列出能稳定复现该问题的操作"
      placeholder: |
        1. 启动 `dazitui`
        2. 按 `b` 打开内置赛文浏览器
        3. 选择「常用单字前五百」并载入
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "你认为正确的表现应该是什么"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "实际看到的错误表现（与期望的差异）"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "日志 / 截图 / 录屏"
      description: "如有报错、崩溃堆栈、终端截图或录屏，请粘贴或上传（可拖拽附件）"
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: "附加信息"
      description: "其他可能相关的上下文（配置、是否首次出现、是否与 52dazi 在线/本地统计相关等）"
