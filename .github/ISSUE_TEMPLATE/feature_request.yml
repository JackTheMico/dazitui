name: ✨ 功能建议 (Feature Request)
description: 提议新功能、改进或增强 dazitui 的既有能力
title: "[Feature] 简短描述建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述你遇到的痛点，以及期望的解决方式。
        若已有相关讨论，欢迎在现有 Issue 下补充而非另开。

  - type: textarea
    id: problem
    attributes:
      label: "背景与痛点"
      description: "当前有什么不便？想解决什么问题？"
      placeholder: |
        作为 …, 我经常遇到 …, 这让我 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "期望功能"
      description: "你希望 dazitui 增加/改变什么行为"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案"
      description: "是否考虑过其他实现方式或临时 workaround"

  - type: textarea
    id: context
    attributes:
      label: "附加信息"
      description: "相关截图、参考实现、涉及模块（如虚拟键盘、统计、主题、52dazi 在线等）"
